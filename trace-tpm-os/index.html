<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Loading TRACE OS…</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071018;color:#f5f8fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{text-align:center;padding:32px}.mark{width:56px;height:56px;margin:auto;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,#5f8fff,#65dfd0);color:#041017;font-size:25px;font-weight:900}.box h1{margin:17px 0 4px}.box p{color:#91a6b7}.bar{width:220px;height:6px;background:#132535;border-radius:999px;overflow:hidden;margin:20px auto}.bar:after{content:"";display:block;width:45%;height:100%;background:#65dfd0;animation:move 1s infinite alternate ease-in-out}@keyframes move{to{transform:translateX(122%)}}</style></head><body><div class="box"><div class="mark">T</div><h1>TRACE OS</h1><p>Loading the assurance command centre…</p><div class="bar"></div></div><script>(async()=>{try{const files=Array.from({length:6},(_,i)=>`parts/part-${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(`${f}: HTTP ${r.status}`);return(await r.text()).trim()}));const b64=parts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main style="max-width:680px;padding:40px"><h1>TRACE OS could not load</h1><p>'+String(e)+'</p></main>';console.error(e)}})();</script></body></html>
